function tradeMenu(id){var t=DB.trades.find(function(x){return x.id===id});if(!t)return;modal('<div class="sheet-head"><h2>Trade options</h2><button class="icon-btn" data-action="close-modal">'+icon('close')+'</button></div><div class="card" style="margin:0">'+tradeCard(t)+'</div><div class="stack"><button class="btn primary block" data-action="edit-trade" data-id="'+esc(id)+'">Review / edit</button><button class="btn outline block" data-action="duplicate-trade" data-id="'+esc(id)+'">Duplicate</button><button class="btn danger block" data-action="delete-trade" data-id="'+esc(id)+'">Delete</button></div>')}

function changeDay(n){var d=date(App.state.selectedDate);d.setDate(d.getDate()+n);App.state.selectedDate=iso(d);App.render()}function changeMonth(n){var p=App.state.calendarMonth.split('-'),d=new Date(+p[0],+p[1]-1+n,1);App.state.calendarMonth=iso(d).slice(0,7);App.render()}
function toast(msg,error){var e=document.getElementById('toast');e.innerHTML='<div class="toast" style="background:'+(error?'#8d2020':'#202127')+'">'+esc(msg)+'</div>';clearTimeout(toast.timer);toast.timer=setTimeout(function(){e.innerHTML=''},3600)}function fatal(msg){document.getElementById('view').innerHTML='<section class="card" style="margin-top:18vh"><h2>Journal database unavailable</h2><p class="sub">'+esc(msg)+'</p><p class="sub">Your database was not erased. Close and reopen the app.</p></section>';document.getElementById('bottomNav').innerHTML=''}
async function saveSettings(){var next={theme:DB.settings.theme};document.querySelectorAll('[data-setting]').forEach(function(e){var v=e.value.trim();next[e.dataset.setting]=v===''?null:Number(v)});try{Object.keys(next).forEach(function(k){if(k!=='theme'&&next[k]!=null&&(!Number.isFinite(next[k])||next[k]<0))throw Error('Risk values must be zero or greater')});DB.settings=await Store.settings(next);theme();App.render();toast('Risk plan saved')}catch(e){toast(e.message,true)}}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var go=b.dataset.go;if(go){App.go(go);return}var a=b.dataset.action,v=b.dataset.value,id=b.dataset.id;if(!a)return;if(a==='close-modal')return closeModal();if(a==='add-trade')return openTradeForm(null,b.dataset.date);if(a==='form-result'){var f=document.getElementById('tradeForm');f.result.value=v;f.querySelectorAll('.result-toggle button').forEach(function(x){x.classList.toggle('active',x.dataset.value===v)});return}if(a==='period'){App.state.period=v;App.render();return}if(a==='trade-result'){App.state.tradeResult=v;App.render();return}if(a==='trade-symbol'){App.state.tradeSymbol=v;App.render();return}if(a==='granularity'){App.state.granularity=v;App.render();return}if(a==='open-reviews'){App.state.period='all';App.state.tradeResult='all';App.go('trades');return}if(a==='open-day'){App.state.selectedDate=b.dataset.date;App.go('day');return}if(a==='month-prev')return changeMonth(-1);if(a==='month-next')return changeMonth(1);if(a==='month-today'){App.state.calendarMonth=iso().slice(0,7);App.render();return}if(a==='day-prev')return changeDay(-1);if(a==='day-next')return changeDay(1);if(a==='open-story'){App.state.storyId=id;App.go('story');return}if(a==='trade-menu')return tradeMenu(id);if(a==='edit-trade'){closeModal();return openTradeForm(id)}if(a==='add-images')return Store.images(id,b.dataset.kind);if(a==='delete-image')return confirmDialog('Remove image?','This chart image will be deleted from the device and future backups.','Remove','confirm-delete-image',id);if(a==='confirm-delete-image'){b.disabled=true;Store.delImage(id).then(function(){closeModal();App.reload();toast('Image removed')}).catch(function(x){b.disabled=false;toast(x.message,true)});return}if(a==='theme'){DB.settings.theme=v;theme();Store.settings(DB.settings).then(function(s){DB.settings=s;App.render()}).catch(function(x){toast(x.message,true)});return}if(a==='save-settings')return saveSettings();if(a==='export-package')return Store.exportPackage();if(a==='export-json')return Store.exportJson();if(a==='export-csv')return Store.exportCsv();if(a==='import-json-merge')return Store.importJson('merge');if(a==='import-package-merge')return Store.importPackage('merge');if(a==='import-package-replace')return confirmDialog('Replace journal?','A valid package will replace trades, images, and settings only after validation.','Choose package','confirm-package-replace');if(a==='confirm-package-replace'){closeModal();return Store.importPackage('replace')}if(a==='choose-folder')return Store.folder();if(a==='backup-now')return Store.backup();if(a==='duplicate-trade'){b.disabled=true;Store.duplicate(id).then(function(){closeModal();App.reload();toast('Trade and images duplicated')}).catch(function(x){b.disabled=false;toast(x.message,true)});return}if(a==='delete-trade')return confirmDialog('Delete trade?','The trade and its chart images will be removed.','Delete','confirm-delete',id);if(a==='confirm-delete'){b.disabled=true;Store.del(id).then(function(){closeModal();App.state.view='trades';App.reload();toast('Trade deleted')}).catch(function(x){b.disabled=false;toast(x.message,true)});return}if(a==='clear-all')return confirmDialog('Clear journal?','All trades, settings, and private chart images will be removed. External backups remain.','Clear all','confirm-clear',null,true);if(a==='confirm-clear'){if((document.getElementById('confirmText').value||'').trim()!=='CLEAR')return toast('Type CLEAR exactly',true);b.disabled=true;Store.clear().then(function(){closeModal();App.reload();toast('Journal cleared')}).catch(function(x){b.disabled=false;toast(x.message,true)})}});
document.addEventListener('submit',function(e){if(e.target.id!=='tradeForm')return;e.preventDefault();var f=e.target,x=new FormData(f),old=DB.trades.find(function(t){return t.id===f.dataset.id}),amount=Number(x.get('pnl')),result=String(x.get('result')),err=document.getElementById('tradeError'),save=f.querySelector('[type=submit]');try{if(!date(String(x.get('date'))))throw Error('Choose a valid date');if(!Number.isFinite(amount)||amount<0)throw Error('Enter a valid PnL amount');function n(k){var v=String(x.get(k)||'').trim();return v===''?null:Number(v)}var t={id:f.dataset.id||undefined,date:String(x.get('date')),timestamp:old?old.timestamp:Date.now(),result:result,pnl:result==='loss'?-Math.abs(amount):Math.abs(amount),symbol:String(x.get('symbol')||'').trim(),entryTime:String(x.get('entryTime')||'').trim(),setup:String(x.get('setup')||'').trim(),session:String(x.get('session')||''),emotion:String(x.get('emotion')||''),mistakes:x.getAll('mistake'),plannedR:n('plannedR'),realizedR:n('realizedR'),executionScore:n('executionScore'),reviewed:x.get('reviewed')==='on',notes:String(x.get('notes')||'').trim()};save.disabled=true;err.textContent='';(old?Store.update(t):Store.add(t)).then(function(saved){closeModal();App.state.storyId=saved.id;App.state.view='story';App.reload();toast(old?'Trade review saved':'Trade committed to SQLite')}).catch(function(y){save.disabled=false;err.textContent=y.message})}catch(y){err.textContent=y.message}});
