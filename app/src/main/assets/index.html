<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101318">
<title>Trading PnL Journal</title>
<style>
:root{--bg:#f2f5f9;--surface:#fff;--surface2:#edf1f6;--surface3:#e3e9f0;--text:#1c232d;--text2:#5a6572;--text3:#818b98;--border:#d9e0e8;--primary:#1a73e8;--on:#fff;--pc:#d3e3fd;--opc:#0b4aa5;--win:#188038;--winbg:#e4f3e9;--loss:#c5221f;--lossbg:#fce8e6;--warn:#8b5700;--warnbg:#fff1c7;--shadow:0 1px 3px #0f172a12;--radius:16px}
html[data-theme=dark]{--bg:#101318;--surface:#1a1e24;--surface2:#242a33;--surface3:#2e3540;--text:#e7eaef;--text2:#a9b1bd;--text3:#7e8794;--border:#303743;--primary:#8ab4f8;--on:#0b2a5b;--pc:#1e3a63;--opc:#c2d9ff;--win:#79c98d;--winbg:#243a2c;--loss:#ef8a86;--lossbg:#432525;--warn:#f6cf62;--warnbg:#3b3420;--shadow:0 1px 3px #0008;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer;color:inherit}button:disabled{opacity:.55;cursor:default}h1,h2,h3,p{margin:0}.num{font-variant-numeric:tabular-nums}.pos{color:var(--win)}.neg{color:var(--loss)}
#app{min-height:100vh;padding-bottom:calc(112px + env(safe-area-inset-bottom))}main{padding:18px 12px 28px;max-width:780px;margin:auto}.head{display:flex;align-items:center;gap:8px;margin:0 2px 14px}.head h1{font-size:24px;line-height:1.2;flex:1}.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:50%;background:var(--surface2)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}.card-title{font-weight:750;font-size:16px}.sub{color:var(--text2);font-size:12.5px;margin-top:4px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-weight:750}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px;min-width:0}.stat.hero{grid-column:1/-1}.stat-v{font-size:22px;font-weight:800;margin-top:4px;overflow-wrap:anywhere}.hero .stat-v{font-size:30px}.stat-s{font-size:12px;color:var(--text2);margin-top:5px}
.seg{display:flex;background:var(--surface2);padding:4px;border-radius:14px;margin-top:10px;gap:3px}.seg button{flex:1;min-height:44px;padding:5px;border-radius:10px;background:transparent;color:var(--text2);font-size:13px;font-weight:650}.seg button.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{min-height:44px;padding:0 15px;border-radius:24px;background:var(--surface);border:1px solid var(--border);color:var(--text2);font-weight:650}.chip.active{background:var(--pc);color:var(--opc);border-color:transparent}.filter-label{font-size:11px;color:var(--text3);font-weight:750;letter-spacing:.5px;text-transform:uppercase;margin-top:14px}
.btn{min-height:48px;border-radius:14px;padding:0 18px;background:var(--surface2);font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.primary{background:var(--primary);color:var(--on)}.btn.tonal{background:var(--pc);color:var(--opc)}.btn.outline{background:var(--surface);border:1px solid var(--border);color:var(--primary)}.btn.danger{background:var(--loss);color:white}.btn.block{width:100%}.stack{display:grid;gap:10px;margin-top:12px}.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.banner{display:flex;gap:10px;align-items:flex-start;padding:13px;border-radius:14px;margin-bottom:12px;background:var(--warnbg);color:var(--warn);font-weight:650;font-size:13px}.banner.error{background:var(--lossbg);color:var(--loss)}.empty{text-align:center;padding:36px 18px;color:var(--text2)}.empty h3{color:var(--text);margin:10px 0 5px}.empty .btn{margin-top:16px}
#bottomNav{position:fixed;z-index:30;bottom:0;left:0;right:0;height:calc(65px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--border);display:flex}#bottomNav button{flex:1;background:transparent;color:var(--text3);min-width:0;font-size:10.5px;font-weight:650;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}#bottomNav button.active{color:var(--primary)}#fab{position:fixed;z-index:32;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:17px;background:var(--primary);color:var(--on);box-shadow:0 9px 28px #0005;display:grid;place-items:center}body[data-view=settings] #fab{display:none}
.range{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.range .btn{grid-column:1/-1}.field{margin-top:13px}.field label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px}.input,.field input,.field textarea,.field select{display:block;width:100%;min-height:48px;border:1px solid var(--border);border-radius:13px;padding:0 14px;background:var(--surface);color:var(--text);outline:0}.field textarea{padding:12px 14px;min-height:96px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px #1a73e833}.form-error{color:var(--loss);font-size:12.5px;margin-top:10px;min-height:18px}
.trade-row{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:10px;padding:13px 0;border-bottom:1px solid var(--border)}.trade-row:last-child{border-bottom:0}.badge{font-size:10px;font-weight:800;letter-spacing:.4px;border-radius:8px;padding:5px 7px;margin-top:2px}.badge.win{color:var(--win);background:var(--winbg)}.badge.loss{color:var(--loss);background:var(--lossbg)}.trade-pnl{font-size:18px;font-weight:800}.trade-meta{color:var(--text2);font-size:12px}.trade-notes{font-size:13px;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}.summary{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:8px}.summary strong{font-size:18px;display:block}.summary span{font-size:10px;color:var(--text3);text-transform:uppercase;font-weight:750}
.calendar{padding:10px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.weekdays div{text-align:center;color:var(--text3);font-size:9px;font-weight:750;padding:5px 0}.day{min-width:0;min-height:68px;padding:7px 3px;border:1px solid var(--border);border-radius:10px;background:var(--surface);text-align:center}.day.out{opacity:.38}.day.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}.day.has.posday{background:var(--winbg)}.day.has.negday{background:var(--lossbg)}.day-n{font-size:12px;font-weight:750}.day-count,.day-pnl{font-size:8.5px;line-height:1.15;margin-top:4px;overflow-wrap:anywhere}.day-pnl{font-weight:800}.month-nav{display:flex;align-items:center;gap:4px}.month-nav h1{font-size:21px}
.chart{width:100%;height:180px;margin-top:12px}.chart text{fill:var(--text3);font-size:9px}.chart .grid{stroke:var(--border);stroke-width:1}.chart .line{fill:none;stroke:var(--primary);stroke-width:2.5}.chart .zero{stroke:var(--text3);stroke-dasharray:3 3}.bars{display:flex;align-items:stretch;height:190px;gap:5px;margin-top:12px;border-bottom:1px solid var(--border)}.bar-col{flex:1;min-width:0;position:relative}.bar{position:absolute;left:15%;right:15%;border-radius:4px 4px 0 0}.bar.posbar{background:var(--win)}.bar.negbar{background:var(--loss);border-radius:0 0 4px 4px}.bar-lbl{position:absolute;left:0;right:0;bottom:-21px;text-align:center;color:var(--text3);font-size:8px;white-space:nowrap;overflow:hidden}
.modal-root{position:fixed;z-index:50;inset:0;pointer-events:none}.backdrop{position:absolute;inset:0;background:#0009;pointer-events:auto}.sheet{pointer-events:auto;position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px #0005}.sheet.narrow{max-width:560px;margin:auto}.sheet-head{display:flex;align-items:center;gap:10px;position:sticky;top:-18px;background:var(--surface);z-index:2;padding:14px 0 8px}.sheet-head h2{flex:1}.result-toggle{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result-toggle button{min-height:58px;border:2px solid var(--border);border-radius:14px;background:var(--surface);font-size:17px;font-weight:800}.result-toggle .win.active{border-color:var(--win);background:var(--winbg);color:var(--win)}.result-toggle .loss.active{border-color:var(--loss);background:var(--lossbg);color:var(--loss)}.sheet-actions{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));display:flex;justify-content:flex-end;gap:8px;background:var(--surface);padding:12px 0 calc(18px + env(safe-area-inset-bottom));margin-top:12px}.toast{position:fixed;z-index:80;left:16px;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));max-width:520px;margin:auto;padding:13px 16px;border-radius:13px;background:#222831;color:white;box-shadow:0 8px 28px #0006}.danger-card{border-color:#c5221f55}.settings-grid{display:grid;gap:0}.storage-ok{color:var(--win);font-weight:700}.fatal{max-width:600px;margin:15vh auto;padding:22px}.hidden{display:none!important}
@media(min-width:620px){main{padding-top:30px}.stat-grid{grid-template-columns:repeat(4,1fr)}.stat.hero{grid-column:1/-1}.sheet{left:50%;right:auto;width:620px;transform:translateX(-50%)}.day{min-height:88px}.day-count,.day-pnl{font-size:10px}.range{grid-template-columns:1fr 1fr auto}.range .btn{grid-column:auto}.settings-grid{grid-template-columns:1fr 1fr;gap:10px}.settings-grid .card{margin-bottom:0}}
@media(max-width:370px){main{padding-left:8px;padding-right:8px}.card,.stat{padding:13px}.seg button{font-size:11px}.calendar{padding:6px}.days,.weekdays{gap:2px}.day{padding:6px 1px;min-height:62px}}
</style>
</head>
<body>
<div id="app"><main id="view"></main></div>
<nav id="bottomNav" aria-label="Main navigation"></nav>
<button id="fab" aria-label="Add trade"></button>
<div id="modal" class="modal-root"></div><div id="toast"></div>
<script>
'use strict';
var ICONS={dashboard:'<path d="M4 4h6v6H4zM14 4h6v9h-6zM4 14h6v6H4zM14 17h6v3h-6z"/>',calendar:'<path d="M6 2v3m12-3v3M4 8h16M5 4h14a2 2 0 012 2v14H3V6a2 2 0 012-2zm4 8h2v2H9zm4 0h2v2h-2zm4 0h2v2h-2z" fill="none" stroke="currentColor" stroke-width="2"/>',trades:'<path d="M5 5h14M5 12h14M5 19h14M2 5h.01M2 12h.01M2 19h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',stats:'<path d="M4 20V10h3v10zm7 0V4h3v16zm7 0v-7h3v7z"/>',settings:'<path d="M4 6h7m4 0h5M4 12h3m4 0h9M4 18h9m4 0h3M11 3v6M7 9v6m6 0v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',plus:'<path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',more:'<path d="M6 12h.01M12 12h.01M18 12h.01" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>',back:'<path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2"/>',close:'<path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2"/>',warn:'<path d="M12 3L2 21h20L12 3zm0 6v5m0 3v.01" fill="none" stroke="currentColor" stroke-width="2"/>'};
function icon(name,size){return '<svg width="'+(size||22)+'" height="'+(size||22)+'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+ICONS[name]+'</svg>'}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function localISO(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseDate(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');if(!m)return null;var d=new Date(+m[1],+m[2]-1,+m[3]);return d.getFullYear()==+m[1]&&d.getMonth()==+m[2]-1&&d.getDate()==+m[3]?d:null}
function fmtDate(s,opt){var d=parseDate(s);return d?new Intl.DateTimeFormat('en-US',opt||{month:'short',day:'numeric',year:'numeric'}).format(d):s}
function fmtUSD(n){n=Number(n)||0;var abs=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return n>0?'+$'+abs:n<0?'-$'+abs:'$0.00'}
function fmtPct(n){return (Math.round((Number(n)||0)*10)/10).toLocaleString()+'%'}
function clsPnl(n){return n>0?'pos':n<0?'neg':''}
function plural(n,w){return n+' '+w+(n===1?'':'s')}
function startWeek(d){var x=new Date(d),day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x}
function sameOrAfter(a,b){return a>=b}function sameOrBefore(a,b){return a<=b}
function stats(ts){var wins=ts.filter(function(t){return t.result==='win'}).length,total=ts.reduce(function(a,t){return a+t.pnl},0);return{count:ts.length,wins:wins,losses:ts.length-wins,total:total,winrate:ts.length?wins/ts.length*100:0,avg:ts.length?total/ts.length:0,best:ts.length?Math.max.apply(null,ts.map(function(t){return t.pnl})):null,worst:ts.length?Math.min.apply(null,ts.map(function(t){return t.pnl})):null}}
function normalizedTrade(t){return{id:String(t.id),date:String(t.date),timestamp:Number(t.timestamp),result:String(t.result),pnl:Number(t.pnl),symbol:String(t.symbol||''),notes:String(t.notes||''),entryTime:String(t.entryTime||'')}}

var JournalStorage={
  require:function(){if(!window.AndroidJournal)throw new Error('Native Android storage bridge is unavailable. Install and open the APK.')},
  call:function(name,arg){this.require();var raw=arg===undefined?AndroidJournal[name]():AndroidJournal[name](typeof arg==='string'?arg:JSON.stringify(arg));var out=JSON.parse(raw);if(!out.success)throw new Error(out.error||'Database operation failed');return out},
  initialize:function(){return Promise.resolve(this.call('initialize'))},
  addTrade:function(t){return Promise.resolve(this.call('addTrade',t).trade)},updateTrade:function(t){return Promise.resolve(this.call('updateTrade',t).trade)},
  deleteTrade:function(id){return Promise.resolve(this.call('deleteTrade',id))},duplicateTrade:function(id){return Promise.resolve(this.call('duplicateTrade',id).trade)},
  saveSettings:function(s){return Promise.resolve(this.call('saveSettings',s).settings)},clearAll:function(){return Promise.resolve(this.call('clearAllData'))},
  exportJson:function(){this.require();AndroidJournal.exportBackup()},exportCsv:function(){this.require();AndroidJournal.exportCsv()},importJson:function(mode){this.require();AndroidJournal.importBackup(mode)},chooseFolder:function(){this.require();AndroidJournal.chooseBackupFolder()},backupNow:function(){this.require();AndroidJournal.backupNow()},
  onNativeEvent:function(raw){var e=JSON.parse(raw);toast(e.message,!e.success);if(e.refresh)App.reload()}
};

var DB={trades:[],settings:{theme:'system',startingBalance:null,profitTarget:null,maxDrawdown:null,dailyDrawdown:null},backupFolder:null};
var App={
 state:{view:'dashboard',selectedDate:localISO(),calendarMonth:localISO().slice(0,7),period:'all',customFrom:'',customTo:'',tradePeriod:'all',tradeResult:'all',tradePnl:'all',tradeSymbol:'all',sort:'newest',limit:50,granularity:'daily'},
 init:function(){JournalStorage.initialize().then(function(data){DB.trades=data.trades.map(normalizedTrade);DB.settings=data.settings;DB.backupFolder=data.backupFolder;applyTheme();App.render()}).catch(function(e){fatal(e.message)})},
 reload:function(){JournalStorage.initialize().then(function(data){DB.trades=data.trades.map(normalizedTrade);DB.settings=data.settings;DB.backupFolder=data.backupFolder;applyTheme();App.render()}).catch(function(e){toast(e.message,true)})},
 go:function(v){this.state.view=v;this.state.limit=50;this.render();window.scrollTo(0,0)},
 handleBack:function(){if(document.getElementById('modal').innerHTML){closeModal();return true}if(this.state.view==='day'){this.go('calendar');return true}return false},
 render:function(){var fn={dashboard:viewDashboard,calendar:viewCalendar,day:viewDay,trades:viewTrades,stats:viewStats,settings:viewSettings}[this.state.view]||viewDashboard;document.body.dataset.view=this.state.view;document.getElementById('view').innerHTML=fn();renderNav();document.getElementById('fab').innerHTML=icon('plus',28)}
};
function applyTheme(){var t=DB.settings.theme||'system',dark=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('meta[name=theme-color]').content=dark?'#101318':'#f2f5f9'}
function renderNav(){var items=[['dashboard','dashboard','Dashboard'],['calendar','calendar','Calendar'],['trades','trades','Trades'],['stats','stats','Stats'],['settings','settings','Settings']];document.getElementById('bottomNav').innerHTML=items.map(function(i){return '<button data-go="'+i[0]+'" class="'+(App.state.view===i[0]||(App.state.view==='day'&&i[0]==='calendar')?'active':'')+'">'+icon(i[1],21)+'<span>'+i[2]+'</span></button>'}).join('')}
function filteredPeriod(ts,kind,from,to){var now=new Date(),start,end;if(kind==='week'){start=startWeek(now);end=new Date(start);end.setDate(end.getDate()+6)}else if(kind==='month'){start=new Date(now.getFullYear(),now.getMonth(),1);end=new Date(now.getFullYear(),now.getMonth()+1,0)}else if(kind==='custom'){start=parseDate(from);end=parseDate(to);if(!start||!end||start>end)return[]}else return ts.slice();var a=localISO(start),b=localISO(end);return ts.filter(function(t){return sameOrAfter(t.date,a)&&sameOrBefore(t.date,b)})}
function periodSelector(current,prefix){return '<div class="seg">'+[['all','All Time'],['week','This Week'],['month','This Month'],['custom','Custom']].map(function(x){return '<button data-action="'+prefix+'-period" data-value="'+x[0]+'" class="'+(current===x[0]?'active':'')+'">'+x[1]+'</button>'}).join('')+'</div>'}
function customRange(action){return '<div class="range"><div class="field"><label>From</label><input id="rangeFrom" type="date" value="'+esc(App.state.customFrom)+'"></div><div class="field"><label>To</label><input id="rangeTo" type="date" value="'+esc(App.state.customTo)+'"></div><button class="btn tonal" data-action="'+action+'">Apply</button></div>'}
function statBox(label,value,sub,hero){return '<div class="stat '+(hero?'hero':'')+'"><div class="label">'+label+'</div><div class="stat-v num">'+value+'</div><div class="stat-s">'+sub+'</div></div>'}
function riskBanners(){var out='',all=stats(DB.trades),today=stats(DB.trades.filter(function(t){return t.date===localISO()}));if(DB.settings.dailyDrawdown!=null&&today.total<=-DB.settings.dailyDrawdown)out+='<div class="banner">'+icon('warn',20)+'Daily loss limit reached: '+fmtUSD(today.total)+'</div>';if(DB.settings.startingBalance!=null&&DB.settings.maxDrawdown!=null&&DB.settings.startingBalance+all.total<=DB.settings.startingBalance-DB.settings.maxDrawdown)out+='<div class="banner">'+icon('warn',20)+'Maximum drawdown floor reached.</div>';return out}
function viewDashboard(){var ts=filteredPeriod(DB.trades,App.state.period,App.state.customFrom,App.state.customTo),s=stats(ts),h='<div class="head"><h1>Dashboard</h1></div><div class="card"><div class="card-title">Period</div>'+periodSelector(App.state.period,'dash')+(App.state.period==='custom'?customRange('apply-range'):'')+'</div>'+riskBanners();if(DB.settings.startingBalance!=null){var all=stats(DB.trades),current=DB.settings.startingBalance+all.total,p=DB.settings.profitTarget?Math.max(0,Math.min(100,all.total/DB.settings.profitTarget*100)):null;h+='<div class="card"><div class="card-title">Account</div><div class="summary"><div><strong>'+fmtUSD(DB.settings.startingBalance)+'</strong><span>Starting</span></div><div><strong class="'+clsPnl(all.total)+'">'+fmtUSD(current)+'</strong><span>Current</span></div><div><strong>'+(p==null?'—':fmtPct(p))+'</strong><span>Target</span></div></div></div>'}h+='<div class="stat-grid">'+statBox('Total PnL','<span class="'+clsPnl(s.total)+'">'+fmtUSD(s.total)+'</span>',plural(s.count,'trade'),true)+statBox('Winrate',fmtPct(s.winrate),s.wins+' wins · '+s.losses+' losses')+statBox('Avg PnL / Trade','<span class="'+clsPnl(s.avg)+'">'+fmtUSD(s.avg)+'</span>','Mean of trades')+statBox('Best Trade',s.best==null?'—':'<span class="'+clsPnl(s.best)+'">'+fmtUSD(s.best)+'</span>',s.best==null?'No trades':'Highest PnL')+statBox('Worst Trade',s.worst==null?'—':'<span class="'+clsPnl(s.worst)+'">'+fmtUSD(s.worst)+'</span>',s.worst==null?'No trades':'Lowest PnL')+'</div>';h+='<div class="card"><div class="card-title">Cumulative PnL</div>'+lineChart(ts)+'</div><div class="card"><div class="card-title">Recent trades</div>'+(ts.length?ts.slice().sort(sortNewest).slice(0,5).map(tradeRow).join(''):empty('No trades yet','Log your first trade in a few seconds.','add-trade'))+'</div>';return h}
function sortNewest(a,b){return b.timestamp-a.timestamp||b.id.localeCompare(a.id)}
function tradeRow(t){var meta=[fmtDate(t.date,{month:'short',day:'numeric'})];if(t.entryTime)meta.push(esc(t.entryTime));if(t.symbol)meta.push(esc(t.symbol));return '<div class="trade-row"><span class="badge '+t.result+'">'+t.result.toUpperCase()+'</span><div><div class="trade-pnl num '+clsPnl(t.pnl)+'">'+fmtUSD(t.pnl)+'</div><div class="trade-meta">'+meta.join(' · ')+'</div>'+(t.notes?'<div class="trade-notes">'+esc(t.notes)+'</div>':'')+'</div><button class="icon-btn" data-action="trade-menu" data-id="'+esc(t.id)+'" aria-label="Trade actions">'+icon('more')+'</button></div>'}
function empty(title,sub,action){return '<div class="empty"><div>'+icon('calendar',34)+'</div><h3>'+title+'</h3><div>'+sub+'</div>'+(action?'<button class="btn tonal" data-action="'+action+'">Add trade</button>':'')+'</div>'}
function viewCalendar(){var p=App.state.calendarMonth.split('-'),y=+p[0],m=+p[1]-1,first=new Date(y,m,1),offset=(first.getDay()+6)%7,start=new Date(y,m,1-offset),days='',today=localISO();for(var i=0;i<42;i++){var d=new Date(start);d.setDate(start.getDate()+i);var key=localISO(d),dt=DB.trades.filter(function(t){return t.date===key}),s=stats(dt),out=d.getMonth()!==m;days+='<button class="day '+(out?'out ':'')+(key===today?'today ':'')+(dt.length?'has '+(s.total>=0?'posday':'negday'):'')+'" data-action="open-day" data-date="'+key+'" aria-label="'+key+', '+plural(dt.length,'trade')+'"><div class="day-n">'+d.getDate()+'</div>'+(out?'':('<div class="day-count">'+(dt.length?plural(dt.length,'trade'):'No trades')+'</div>'+(dt.length?'<div class="day-pnl '+clsPnl(s.total)+'">'+fmtUSD(s.total)+'</div>':'')))+'</button>'}var monthTrades=DB.trades.filter(function(t){return t.date.slice(0,7)===App.state.calendarMonth}),ms=stats(monthTrades);return '<div class="head month-nav"><h1>'+new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric'}).format(first)+'</h1><button class="icon-btn" data-action="month-prev">‹</button><button class="icon-btn" data-action="month-next">›</button><button class="btn" data-action="month-today">Today</button></div><div class="card calendar"><div class="weekdays">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(x){return '<div>'+x+'</div>'}).join('')+'</div><div class="days">'+days+'</div></div><div class="card"><div class="card-title">Month summary</div><div class="summary"><div><strong>'+ms.count+'</strong><span>Trades</span></div><div><strong>'+fmtPct(ms.winrate)+'</strong><span>Winrate</span></div><div><strong class="'+clsPnl(ms.total)+'">'+fmtUSD(ms.total)+'</strong><span>PnL</span></div></div></div>'}
function viewDay(){var key=App.state.selectedDate,ts=DB.trades.filter(function(t){return t.date===key}).sort(sortNewest),s=stats(ts);return '<div class="head"><button class="icon-btn" data-go="calendar">'+icon('back')+'</button><div class="grow"><h1>'+fmtDate(key,{month:'long',day:'numeric',year:'numeric'})+'</h1><div class="sub">'+fmtDate(key,{weekday:'long'})+'</div></div><button class="icon-btn" data-action="day-prev">‹</button><button class="icon-btn" data-action="day-next">›</button></div><div class="card"><div class="summary"><div><strong>'+s.count+'</strong><span>Trades</span></div><div><strong>'+fmtPct(s.winrate)+'</strong><span>Winrate</span></div><div><strong class="'+clsPnl(s.total)+'">'+fmtUSD(s.total)+'</strong><span>PnL</span></div></div></div>'+(DB.settings.dailyDrawdown!=null&&s.total<=-DB.settings.dailyDrawdown?'<div class="banner">'+icon('warn',20)+'Daily loss limit reached</div>':'')+'<button class="btn primary block" data-action="add-trade" data-date="'+key+'">'+icon('plus')+'Add Trade</button><div class="card" style="margin-top:12px">'+(ts.length?ts.map(tradeRow).join(''):empty('No trades on this day','Tap Add Trade above to log one.'))+'</div>'}
function tradeList(){var ts=filteredPeriod(DB.trades,App.state.tradePeriod,App.state.customFrom,App.state.customTo);if(App.state.tradeResult!=='all')ts=ts.filter(function(t){return t.result===App.state.tradeResult});if(App.state.tradePnl==='positive')ts=ts.filter(function(t){return t.pnl>0});if(App.state.tradePnl==='negative')ts=ts.filter(function(t){return t.pnl<0});if(App.state.tradeSymbol!=='all')ts=ts.filter(function(t){return t.symbol===App.state.tradeSymbol});ts.sort(App.state.sort==='oldest'?function(a,b){return a.timestamp-b.timestamp}:sortNewest);return ts}
function chipGroup(action,current,items){return '<div class="chips">'+items.map(function(x){return '<button class="chip '+(current===x[0]?'active':'')+'" data-action="'+action+'" data-value="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'}
function viewTrades(){var ts=tradeList(),s=stats(ts),symbols=Array.from(new Set(DB.trades.map(function(t){return t.symbol}).filter(Boolean))).sort(),shown=ts.slice(0,App.state.limit);return '<div class="head"><h1>Trades</h1></div><div class="card"><div class="filter-label" style="margin-top:0">Period</div>'+chipGroup('trade-period',App.state.tradePeriod,[['all','All'],['week','This Week'],['month','This Month'],['custom','Custom']])+(App.state.tradePeriod==='custom'?customRange('apply-range'):'')+'<div class="filter-label">Result</div>'+chipGroup('trade-result',App.state.tradeResult,[['all','All'],['win','Wins'],['loss','Losses']])+'<div class="filter-label">PnL</div>'+chipGroup('trade-pnl',App.state.tradePnl,[['all','All'],['positive','Positive'],['negative','Negative']])+'<div class="row"><div class="field grow"><label>Symbol</label><select id="symbolFilter" data-change="symbol"><option value="all">All symbols</option>'+symbols.map(function(x){return '<option '+(App.state.tradeSymbol===x?'selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select></div><div class="field"><label>Sort</label><select id="sortFilter" data-change="sort"><option value="newest" '+(App.state.sort==='newest'?'selected':'')+'>Newest</option><option value="oldest" '+(App.state.sort==='oldest'?'selected':'')+'>Oldest</option></select></div></div></div><div class="card"><div class="summary"><div><strong>'+s.count+'</strong><span>Trades</span></div><div><strong>'+fmtPct(s.winrate)+'</strong><span>Winrate</span></div><div><strong class="'+clsPnl(s.total)+'">'+fmtUSD(s.total)+'</strong><span>PnL</span></div></div></div><div class="card">'+(shown.length?shown.map(tradeRow).join(''):empty('No trades yet','Adjust filters or add your first trade.','add-trade'))+(shown.length<ts.length?'<button class="btn outline block" data-action="show-more">Show more</button>':'')+'</div>'}
function lineChart(ts){var arr=ts.slice().sort(function(a,b){return a.timestamp-b.timestamp}),sum=0,pts=arr.map(function(t){sum+=t.pnl;return sum});if(!pts.length)return '<div class="empty"><h3>Not enough data yet</h3><div>Add trades to see this chart.</div></div>';var min=Math.min(0,Math.min.apply(null,pts)),max=Math.max(0,Math.max.apply(null,pts)),range=max-min||1,w=640,h=150,pad=12,path=pts.map(function(v,i){var x=pad+(w-2*pad)*(pts.length===1?.5:i/(pts.length-1)),y=pad+(h-2*pad)*(max-v)/range;return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' '),zero=pad+(h-2*pad)*max/range;return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><line class="zero" x1="0" y1="'+zero+'" x2="'+w+'" y2="'+zero+'"/><path class="line" d="'+path+'"/></svg>'}
function aggregate(ts,gran){var map={};ts.forEach(function(t){var d=parseDate(t.date),key;if(gran==='monthly')key=t.date.slice(0,7);else if(gran==='weekly')key=localISO(startWeek(d));else key=t.date;(map[key]||(map[key]={key:key,pnl:0,count:0})).pnl+=t.pnl;map[key].count++});return Object.keys(map).sort().map(function(k){return map[k]}).slice(gran==='daily'?-30:gran==='weekly'?-16:-12)}
function barChart(rows){if(!rows.length)return '<div class="empty"><h3>Not enough data yet</h3><div>Add trades to unlock period statistics.</div></div>';var max=Math.max.apply(null,rows.map(function(r){return Math.abs(r.pnl)}))||1;return '<div class="bars">'+rows.map(function(r){var pct=Math.abs(r.pnl)/max*45,style=r.pnl>=0?'bottom:50%;height:'+pct+'%':'top:50%;height:'+pct+'%';return '<div class="bar-col" title="'+esc(r.key)+' '+fmtUSD(r.pnl)+'"><div class="bar '+(r.pnl>=0?'posbar':'negbar')+'" style="'+style+'"></div><div class="bar-lbl">'+esc(r.key.slice(5))+'</div></div>'}).join('')+'</div>'}
function viewStats(){var s=stats(DB.trades),rows=aggregate(DB.trades,App.state.granularity);return '<div class="head"><h1>Statistics</h1></div><div class="card"><div class="row"><div class="grow"><div class="card-title">Cumulative PnL</div><div class="sub">All time · '+plural(s.count,'trade')+' · winrate '+fmtPct(s.winrate)+'</div></div><strong class="num '+clsPnl(s.total)+'">'+fmtUSD(s.total)+'</strong></div>'+lineChart(DB.trades)+'</div><div class="card"><div class="card-title">Period PnL</div><div class="seg">'+[['daily','Daily'],['weekly','Weekly'],['monthly','Monthly']].map(function(x){return '<button class="'+(App.state.granularity===x[0]?'active':'')+'" data-action="granularity" data-value="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'+barChart(rows)+'</div>'}
function numValue(v){return v==null?'':String(v)}
function viewSettings(){var s=DB.settings;return '<div class="head"><h1>Settings</h1></div><div class="card"><div class="card-title">Theme</div><div class="seg">'+[['light','Light'],['dark','Dark'],['system','System']].map(function(x){return '<button class="'+(s.theme===x[0]?'active':'')+'" data-action="theme" data-value="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div><div class="sub">System follows your Android preference. Saved in SQLite.</div></div><div class="card"><div class="card-title">Account</div><div class="sub">Optional. Used for balance and limit warnings.</div><div class="field"><label>Starting balance (USD)</label><input data-setting="startingBalance" type="number" min="0" step="0.01" value="'+numValue(s.startingBalance)+'"></div><div class="field"><label>Profit target (USD)</label><input data-setting="profitTarget" type="number" min="0" step="0.01" value="'+numValue(s.profitTarget)+'"></div><div class="field"><label>Max drawdown limit (USD)</label><input data-setting="maxDrawdown" type="number" min="0" step="0.01" value="'+numValue(s.maxDrawdown)+'"></div><div class="field"><label>Daily loss limit (USD)</label><input data-setting="dailyDrawdown" type="number" min="0" step="0.01" value="'+numValue(s.dailyDrawdown)+'"></div><button class="btn tonal block" style="margin-top:14px" data-action="save-settings">Save account settings</button></div><div class="card"><div class="card-title">Data</div><div class="sub"><span class="storage-ok">Room / SQLite</span> · '+plural(DB.trades.length,'trade')+' stored on this device.</div><div class="sub">Internal data survives close, force-stop, reboot, and APK updates. Android removes it on uninstall, so keep a portable backup.</div><div class="stack"><button class="btn primary block" data-action="export-json">Export full backup (JSON)</button><button class="btn outline block" data-action="export-csv">Export trades (CSV)</button><button class="btn outline block" data-action="import-merge">Import backup — Merge</button><button class="btn outline block" data-action="import-replace">Import backup — Replace</button></div></div><div class="card"><div class="card-title">Recovery backup folder</div><div class="sub">'+(DB.backupFolder?'Selected: <strong>'+esc(DB.backupFolder)+'</strong>. Automatic backup runs after successful changes.':'No folder selected. Choose a folder that remains available after uninstall.')+'</div><div class="stack"><button class="btn tonal block" data-action="choose-folder">Choose folder</button><button class="btn outline block" data-action="backup-now">Backup now</button></div></div><div class="card danger-card"><div class="card-title">Danger zone</div><button class="btn danger block" style="margin-top:12px" data-action="clear-all">Clear all data</button><div class="sub">External backup files are not deleted.</div></div><div class="card"><div class="card-title">Trading PnL Journal</div><div class="sub">Offline Android app. No account, no tracking, and no required network connection. Journal data is stored locally on this device.</div></div>'}
function toast(msg,error){var el=document.getElementById('toast');el.innerHTML='<div class="toast" style="background:'+(error?'#8e1b18':'#222831')+'">'+esc(msg)+'</div>';clearTimeout(toast.timer);toast.timer=setTimeout(function(){el.innerHTML=''},3500)}

function closeModal(){document.getElementById('modal').innerHTML=''}

function openTradeForm(id,date){var t=id?DB.trades.find(function(x){return x.id===id}):null;t=t||{date:date||App.state.selectedDate||localISO(),result:'win',pnl:'',symbol:'',entryTime:'',notes:''};modal('<div class="sheet-head"><h2>'+(id?'Edit trade':'Add trade')+'</h2><button class="icon-btn" data-action="close-modal">'+icon('close')+'</button></div><form id="tradeForm" data-id="'+esc(id||'')+'"><div class="field"><label>Date</label><input name="date" type="date" required value="'+esc(t.date)+'"></div><div class="field"><label>Result</label><div class="result-toggle"><button type="button" class="win '+(t.result==='win'?'active':'')+'" data-action="form-result" data-value="win">Win</button><button type="button" class="loss '+(t.result==='loss'?'active':'')+'" data-action="form-result" data-value="loss">Loss</button></div><input type="hidden" name="result" value="'+t.result+'"></div><div class="field"><label>PnL amount (USD)</label><input name="pnl" inputmode="decimal" type="number" step="0.01" min="0" required value="'+(t.pnl===''?'':Math.abs(t.pnl))+'"></div><div class="field"><label>Symbol (optional)</label><input name="symbol" maxlength="40" list="symbols" value="'+esc(t.symbol)+'"><datalist id="symbols">'+Array.from(new Set(DB.trades.map(function(x){return x.symbol}).filter(Boolean))).map(function(x){return '<option value="'+esc(x)+'">'}).join('')+'</datalist></div><div class="field"><label>Entry time (optional)</label><input name="entryTime" maxlength="20" value="'+esc(t.entryTime)+'" placeholder="HH:MM or a short note"></div><div class="field"><label>Notes (optional)</label><textarea name="notes" maxlength="1000">'+esc(t.notes)+'</textarea></div><div id="tradeError" class="form-error"></div><div class="sheet-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="submit" class="btn primary">Save trade</button></div></form>')}
function tradeMenu(id){var t=DB.trades.find(function(x){return x.id===id});if(!t)return;modal('<div class="sheet-head"><h2>Trade actions</h2><button class="icon-btn" data-action="close-modal">'+icon('close')+'</button></div>'+tradeRow(t)+'<div class="stack"><button class="btn tonal block" data-action="edit-trade" data-id="'+esc(id)+'">Edit</button><button class="btn outline block" data-action="duplicate-trade" data-id="'+esc(id)+'">Duplicate</button><button class="btn danger block" data-action="delete-trade" data-id="'+esc(id)+'">Delete</button></div>')}
function confirmDialog(title,text,confirmLabel,action,typed,id){modal('<div class="sheet-head"><h2>'+esc(title)+'</h2><button class="icon-btn" data-action="close-modal">'+icon('close')+'</button></div><p class="sub">'+esc(text)+'</p>'+(typed?'<div class="field"><label>Type CLEAR to continue</label><input id="confirmText" autocomplete="off"></div>':'')+'<div class="sheet-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn danger" data-action="'+action+'" '+(id?'data-id="'+esc(id)+'"':'')+'>'+esc(confirmLabel)+'</button></div>')}
function changeDay(n){var d=parseDate(App.state.selectedDate);d.setDate(d.getDate()+n);App.state.selectedDate=localISO(d);App.render()}
function changeMonth(n){var p=App.state.calendarMonth.split('-'),d=new Date(+p[0],+p[1]-1+n,1);App.state.calendarMonth=localISO(d).slice(0,7);App.render()}
async function saveSettings(){var next={theme:DB.settings.theme};document.querySelectorAll('[data-setting]').forEach(function(el){var v=el.value.trim();next[el.dataset.setting]=v===''?null:Number(v)});try{Object.keys(next).forEach(function(k){if(k!=='theme'&&next[k]!=null&&(!Number.isFinite(next[k])||next[k]<0))throw new Error('Account values must be zero or greater')});DB.settings=await JournalStorage.saveSettings(next);applyTheme();App.render();toast('Settings saved')}catch(e){toast(e.message,true)}}

document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var go=b.dataset.go;if(go){App.go(go);return}var a=b.dataset.action,v=b.dataset.value,id=b.dataset.id;if(!a)return;if(a==='close-modal')return closeModal();if(a==='add-trade')return openTradeForm(null,b.dataset.date);if(a==='trade-menu')return tradeMenu(id);if(a==='edit-trade'){closeModal();return openTradeForm(id)}if(a==='form-result'){var f=document.getElementById('tradeForm');f.result.value=v;f.querySelectorAll('.result-toggle button').forEach(function(x){x.classList.toggle('active',x.dataset.value===v)});return}if(a==='dash-period'){App.state.period=v;App.render();return}if(a==='trade-period'){App.state.tradePeriod=v;App.render();return}if(a==='trade-result'){App.state.tradeResult=v;App.render();return}if(a==='trade-pnl'){App.state.tradePnl=v;App.render();return}if(a==='apply-range'){var f=document.getElementById('rangeFrom').value,t=document.getElementById('rangeTo').value;if(!parseDate(f)||!parseDate(t)||f>t){toast('Custom range must have From on or before To',true);return}App.state.customFrom=f;App.state.customTo=t;App.render();return}if(a==='open-day'){App.state.selectedDate=b.dataset.date;App.go('day');return}if(a==='month-prev')return changeMonth(-1);if(a==='month-next')return changeMonth(1);if(a==='month-today'){App.state.calendarMonth=localISO().slice(0,7);App.render();return}if(a==='day-prev')return changeDay(-1);if(a==='day-next')return changeDay(1);if(a==='show-more'){App.state.limit+=50;App.render();return}if(a==='granularity'){App.state.granularity=v;App.render();return}if(a==='theme'){DB.settings.theme=v;applyTheme();JournalStorage.saveSettings(DB.settings).then(function(s){DB.settings=s;App.render()}).catch(function(x){toast(x.message,true)});return}if(a==='save-settings')return saveSettings();if(a==='export-json')return JournalStorage.exportJson();if(a==='export-csv')return JournalStorage.exportCsv();if(a==='import-merge')return JournalStorage.importJson('merge');if(a==='import-replace')return confirmDialog('Replace journal?','The selected valid backup will replace all current trades. Validation happens before deletion.','Choose backup','confirm-replace');if(a==='confirm-replace'){closeModal();return JournalStorage.importJson('replace')}if(a==='choose-folder')return JournalStorage.chooseFolder();if(a==='backup-now')return JournalStorage.backupNow();if(a==='duplicate-trade'){b.disabled=true;JournalStorage.duplicateTrade(id).then(function(){closeModal();App.reload();toast('Trade duplicated')}).catch(function(x){b.disabled=false;toast(x.message,true)});return}if(a==='delete-trade')return confirmDialog('Delete trade?','This trade will be removed from the local database.','Delete','confirm-delete',false,id);if(a==='confirm-delete'){b.disabled=true;JournalStorage.deleteTrade(id).then(function(){closeModal();App.reload();toast('Trade deleted')}).catch(function(x){b.disabled=false;toast(x.message,true)});return}if(a==='clear-all')return confirmDialog('Clear all journal data?','Trades and account settings will be cleared from SQLite. External backup files are not deleted.','Clear all','confirm-clear',true);if(a==='confirm-clear'){if((document.getElementById('confirmText').value||'').trim()!=='CLEAR'){toast('Type CLEAR exactly to continue',true);return}b.disabled=true;JournalStorage.clearAll().then(function(){closeModal();App.reload();toast('Journal data cleared')}).catch(function(x){b.disabled=false;toast(x.message,true)});return}});
document.addEventListener('change',function(e){if(e.target.dataset.change==='symbol'){App.state.tradeSymbol=e.target.value;App.render()}if(e.target.dataset.change==='sort'){App.state.sort=e.target.value;App.render()}});
document.addEventListener('submit',function(e){if(e.target.id!=='tradeForm')return;e.preventDefault();var f=e.target,fd=new FormData(f),old=DB.trades.find(function(x){return x.id===f.dataset.id}),amount=Number(fd.get('pnl')),result=String(fd.get('result')),err=document.getElementById('tradeError'),save=f.querySelector('[type=submit]');try{if(!parseDate(String(fd.get('date'))))throw new Error('Choose a valid date');if(!Number.isFinite(amount)||amount<0)throw new Error('Enter a valid PnL amount');var t={id:f.dataset.id||undefined,date:String(fd.get('date')),timestamp:old?old.timestamp:Date.now(),result:result,pnl:result==='loss'?-Math.abs(amount):Math.abs(amount),symbol:String(fd.get('symbol')||'').trim(),entryTime:String(fd.get('entryTime')||'').trim(),notes:String(fd.get('notes')||'').trim()};save.disabled=true;err.textContent='';(old?JournalStorage.updateTrade(t):JournalStorage.addTrade(t)).then(function(){closeModal();App.reload();toast(old?'Trade updated':'Trade saved')}).catch(function(x){save.disabled=false;err.textContent=x.message})}catch(x){err.textContent=x.message}});
document.getElementById('fab').addEventListener('click',function(){openTradeForm(null,App.state.view==='day'?App.state.selectedDate:localISO())});
if(matchMedia('(prefers-color-scheme:dark)').addEventListener)matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(){if(DB.settings.theme==='system')applyTheme()});
