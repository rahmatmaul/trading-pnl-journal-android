<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Trading PnL Journal for Android</title>
  <desc id="desc">Dark blue banner with a cumulative profit chart and offline Android journal message.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#17243a"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86b6ff" stop-opacity=".35"/><stop offset="1" stop-color="#86b6ff" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <g opacity=".14" stroke="#9bb9df"><path d="M0 80h1280M0 160h1280M0 240h1280M0 320h1280"/><path d="M160 0v400M320 0v400M480 0v400M640 0v400M800 0v400M960 0v400M1120 0v400"/></g>
