  <g transform="translate(74 70)"><rect width="86" height="86" rx="22" fill="#86b6ff"/><path d="M20 61h10V72H20zm17-17h10v28H37zm17 8h10v20H54zm17-29h10v49H71z" fill="#11213a"/><path d="M19 49l19-17 17 8 23-25 7 7-29 31-17-8-13 12z" fill="#fff"/></g>
  <text x="74" y="205" fill="#f3f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800">Trading PnL Journal</text>
  <text x="76" y="252" fill="#a9bdd8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Your trades. Your device. Your data.</text>
